# Maven Wrapper — pins the build tool so the backend builds identically on any
# machine with a JDK and nothing else installed.
#
# distributionType=only-script: mvnw is a plain script that fetches Maven on
# first use. No wrapper .jar is committed, which keeps the L1 gitleaks hook and
# code review looking at source rather than a binary.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
