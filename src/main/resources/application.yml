# Coc Docs Platform backend — base configuration.
#
# Every environment-specific value is supplied by environment variables with no
# usable default. Backend hosting is [DEFERRED] (PM, 2026-09-08), so this file
# must not assume a provider.  // req: CONST-TECH-08, ADR-012 §2
#
# For a personal local setup (your own Postgres, your own Google OAuth client
# id) use one of the two gitignored paths rather than editing a default below:
# copy backend/.env.example to backend/.env.local and export it, or write an
# application-local.yml and run with SPRING_PROFILES_ACTIVE=local. Neither can
# reach a commit; a real value edited into this file can, and has.

spring:
  # Load backend/.env.local directly, so a developer's values reach the
  # application whatever launches it — IDE Run, IDE Debug, `mvn
  # spring-boot:run`, a test — with nothing to install first.
  #
  # This used to be the EnvFile IntelliJ plugin's job, declared in
  # .idea/runConfigurations/Backend__dev_.xml. When that plugin is not
  # installed IntelliJ ignores the <extension> block silently: the run
  # configuration still looks correct, loads nothing, and the application dies
  # on `Driver org.postgresql.Driver claims to not accept jdbcUrl,
  # jdbc:postgresql://${DB_HOST}:${DB_PORT}/...` — the placeholders reaching
  # the driver as literal text. A setup step that fails silently is worse than
  # no setup step, so the loading now lives here, where it cannot be missed.
  #
  # `optional:` means an absent file is not an error, which is the normal case
  # everywhere but a developer machine. Both paths are listed because the
  # working directory is backend/ under the IDE and spring-boot:run, but the
  # repository root under some shells. .env.local is KEY=VALUE, hence
  # [.properties] — the extension hint Spring needs to parse a file whose name
  # does not end in one.
  #
  # This cannot weaken a deployment: OS environment variables outrank imported
  # config data in Spring Boot's precedence, so anything the environment sets
  # still wins, and .env.local is gitignored and never shipped.
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:./backend/.env.local[.properties]

  # Default active profile — deliberately NOT "no profile", so `mvn
  # spring-boot:run`/an IDE run configuration works with zero setup beyond
  # application-dev.yml (committed alongside this file; see its own header).
  # Personal secrets (a real DB_PASSWORD, GOOGLE_CLIENT_ID, etc.) are supplied
  # as environment variables, never a file. An OS environment variable outranks
  # this property in Spring Boot's precedence, so any real deployment overrides
  # it simply by setting SPRING_PROFILES_ACTIVE (to "prod", or to nothing) —
  # nothing here can leak into an environment that sets that variable, which
  # every non-local deployment must.
  profiles:
    active: dev

  application:
    name: docs-platform-backend

  datasource:
    # Any PostgreSQL 15+ instance: managed, corporate, or on-prem. No usable
    # default for host/port/name/credentials.
    #
    # DB_SCHEMA has no default either, and that is deliberate. The team shares
    # one server and each developer owns one schema, so a default here is not
    # a convenience — it is a name that belongs to somebody. This line read
    # `currentSchema=cocdocs_dev` between 555a769 and now, which meant every
    # developer connected to one person schema whatever DB_SCHEMA said, and
    # an unpushed V8 was applied to it by someone who never intended to touch
    # it. Failing to start beats migrating a colleague database.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

    # Migrate the same schema the application reads, and create it if this is
    # the first run against it. Without this Flyway would follow the connection
    # default and could put flyway_schema_history somewhere other than the
    # tables it describes — which is the one pair that must never drift apart.
    # Same name as currentSchema above, and for the same reason no default:
    # Flyway must migrate the schema the connection actually uses.
    schemas: ${DB_SCHEMA}
    create-schemas: true

    # TEMPORARY — REMOVE WHEN EVERY MIGRATION APPLIED TO A DEVELOPER SCHEMA
    # HAS ITS FILE ON dev. V6 has landed; V8__temp_password.sql has not.
    #
    # The recurring shape: a migration is applied to a schema from a branch
    # that was never pushed, so the table or column is there and the file is
    # on one machine. Every other application then refuses to start:
    #
    #   Detected applied migration not resolved locally: 6.
    #
    # Note the two categories are different and this covers only one. An
    # applied version BELOW your highest local migration is `missing`; one
    # ABOVE it is `future`, and the message is identical. V8 against a
    # checkout that stops at V7 is `future`, so it needs `*:future` — set it
    # in your own .env.local rather than here, because it is one person
    # schema being ahead, not a state the team shares.
    #
    # This makes Flyway tolerate an applied migration it cannot find, so the
    # team can work while that file is being pushed. It does NOT touch the
    # database and does not mark anything deleted — when the file lands, it
    # validates normally against the row already there and this line comes out.
    #
    # What it costs while it is here: a migration someone genuinely deletes
    # stops being caught. That is the check this disables, and it is the reason
    # this is temporary rather than a setting.
    #
    # Do NOT reach for `flyway repair` instead. Repair marks version 6 deleted
    # while password_reset_token stays in the schema, so the day that branch
    # merges Flyway tries to create a table that already exists — turning a
    # clear error into a confusing one.
    ignore-migration-patterns: "*:missing"

  jackson:
    default-property-inclusion: non_null

  # Gmail SMTP configuration for password reset emails.
  # Credentials must be supplied through environment variables.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # 8081, not 8080: frontend/lib/auth/api.ts defaults NEXT_PUBLIC_BACKEND_URL to
  # http://localhost:8081, so a zero-config `mvn spring-boot:run` is reachable
  # from a zero-config `next dev`.
  port: ${PORT:8081}
  # Content includes Khmer and Korean; encoding is never left to a platform
  # default on this project.  // req: CONST-OPS-01
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  # Session TTL. AMB-006 resolved 2026-09-08: 1 day.
  # // req: NFR-SEC-SESSION
  session-ttl: P1D

  # The frontend origin, for CORS.
  # // req: ADR-012 §4, NFR-SEC-CHANNEL
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  # Whether the session cookie carries `Secure`. Defaults to true so a
  # deployment is safe unless it deliberately opts out; local development over
  # plain http must set it false (application-dev.yml does exactly that), or the
  # browser discards the cookie and sign-in appears to succeed and then does
  # nothing.
  #
  # Flat key, not a nested `app.cookie.secure`: AppProperties binds
  # `cookieSecure` as a primitive boolean, so a nested block would leave it
  # unbound and default to FALSE — Secure silently dropped in production, the
  # one failure this flag exists to prevent. SameSite and cookie domain are not
  # configurable at all today; AuthController sets SameSite=Lax directly and
  # issues host-only cookies.  // req: NFR-SEC-SESSION, NFR-SEC-CHANNEL
  cookie-secure: ${COOKIE_SECURE:true}

  # Google OAuth client id.
  # // req: FR-AUTH-001
  google-client-id: ${GOOGLE_CLIENT_ID:}

  # Keycloak, which brokers Google upstream (ADR-013). Optional: blank means
  # this deployment has no broker and the application boots exactly as it does
  # without one — every developer machine is in that state until the container
  # is up, and the reader path must not depend on it.
  #
  # Both or neither. An issuer with no audience refuses to start on purpose:
  # KeycloakAuthConfig's audience validator would have nothing to compare
  # against, so leaving it blank skips audience verification silently rather
  # than permissively, and a token Keycloak minted for any other client in the
  # same realm would then verify here.
  #
  # Not spring.security.oauth2.resourceserver.jwt.*: that key makes Spring
  # fetch the issuer's discovery document during startup, so the application
  # could not boot unless Keycloak were reachable — including for tests and a
  # Flyway-only run — and it would autoconfigure a second JwtDecoder competing
  # with the one KeycloakAuthConfig declares. KeycloakAuthConfig builds the
  # decoder from the JWK set URI instead, which it derives from the issuer.
  # // req: FR-AUTH-001, NFR-SEC-AUTH, ADR-013
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    audience: ${KEYCLOAK_AUDIENCE:}

  storage:
    # S3-compatible storage.
    # // req: CONST-TECH-08
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:coc-docs-media}
    region: ${S3_REGION:us-east-1}

# The generated API contract, and the Swagger UI that renders it.
#
# Off here, on in application-dev.yml. This is the base file, so it is what a
# deployment with no dev profile gets: the endpoints are not merely protected,
# they are not mapped at all.
#
# Probing them then returns 401, not 404 — Spring Security's default-deny runs
# before dispatch, so nothing ever reaches the handler that would answer "no
# such route". That is the desired outcome rather than a compromise: the reply
# is byte-for-byte the reply any nonexistent path gives, so it confirms
# nothing. Verified against a prod-profile run — /v3/api-docs, /swagger-ui.html
# and /nonsense-abcxyz are indistinguishable.
#
# That matters because the contract describes every route, including
# /api/v1/admin/accounts/** — the whole of NFR-SEC-PII's surface. Publishing a
# map of it to unauthenticated callers is a disclosure decision, not a
# convenience one, so the default is off and turning it on is per-environment.
#
# Reading the contract outside dev does not need this: docs/api/openapi.yaml is
# the committed snapshot, regenerated by scripts/export-openapi.sh against a
# locally running instance.
#
# // req: NFR-SEC-PII, ADR-011, RISK-018, architecture-overview.md §11
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.flywaydb: INFO
