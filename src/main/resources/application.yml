# Coc Docs Platform backend — base configuration.
#
# Every environment-specific value is supplied by environment variables with no
# usable default. Backend hosting is [DEFERRED] (PM, 2026-09-08), so this file
# must not assume a provider.  // req: CONST-TECH-08, ADR-012 §2

spring:
  application:
    name: docs-platform-backend

  datasource:
    # Any PostgreSQL 15+ instance: managed, corporate, or on-prem. No usable
    # default for host/port/name/credentials.
    #
    # DB_SCHEMA has no default either, and that is deliberate. The team shares
    # one server and each developer owns one schema, so a default here is not
    # a convenience — it is a name that belongs to somebody. This line read
    # `currentSchema=cocdocs_dev` between 555a769 and now, which meant every
    # developer connected to one person schema whatever DB_SCHEMA said, and
    # an unpushed V8 was applied to it by someone who never intended to touch
    # it. Failing to start beats migrating a colleague database.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

    # Migrate the same schema the application reads, and create it if this is
    # the first run against it. Without this Flyway would follow the connection
    # default and could put flyway_schema_history somewhere other than the
    # tables it describes — which is the one pair that must never drift apart.
    # Same name as currentSchema above, and for the same reason no default:
    # Flyway must migrate the schema the connection actually uses.
    schemas: ${DB_SCHEMA}
    create-schemas: true

    # TEMPORARY — REMOVE WHEN EVERY MIGRATION APPLIED TO A DEVELOPER SCHEMA
    # HAS ITS FILE ON dev. V6 has landed; V8__temp_password.sql has not.
    #
    # The recurring shape: a migration is applied to a schema from a branch
    # that was never pushed, so the table or column is there and the file is
    # on one machine. Every other application then refuses to start:
    #
    #   Detected applied migration not resolved locally: 6.
    #
    # Note the two categories are different and this covers only one. An
    # applied version BELOW your highest local migration is `missing`; one
    # ABOVE it is `future`, and the message is identical. V8 against a
    # checkout that stops at V7 is `future`, so it needs `*:future` — set it
    # in your own .env.local rather than here, because it is one person
    # schema being ahead, not a state the team shares.
    #
    # This makes Flyway tolerate an applied migration it cannot find, so the
    # team can work while that file is being pushed. It does NOT touch the
    # database and does not mark anything deleted — when the file lands, it
    # validates normally against the row already there and this line comes out.
    #
    # What it costs while it is here: a migration someone genuinely deletes
    # stops being caught. That is the check this disables, and it is the reason
    # this is temporary rather than a setting.
    #
    # Do NOT reach for `flyway repair` instead. Repair marks version 6 deleted
    # while password_reset_token stays in the schema, so the day that branch
    # merges Flyway tries to create a table that already exists — turning a
    # clear error into a confusing one.
    ignore-migration-patterns: "*:missing"

  jackson:
    default-property-inclusion: non_null

  # Gmail SMTP configuration for password reset emails.
  # Credentials must be supplied through environment variables.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

  # Content includes Khmer and Korean; encoding is never left to a platform
  # default on this project.  // req: CONST-OPS-01
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  # Session TTL. AMB-006 resolved 2026-09-08: 1 day.
  # // req: NFR-SEC-SESSION
  session-ttl: P1D

  # The frontend origin, for CORS.
  # // req: ADR-012 §4, NFR-SEC-CHANNEL
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  # Whether the session cookie carries `Secure`.
  # // req: NFR-SEC-SESSION, NFR-SEC-CHANNEL
  cookie-secure: ${COOKIE_SECURE:true}

  # Google OAuth client id.
  # // req: FR-AUTH-001
  google-client-id: ${GOOGLE_CLIENT_ID:}

  # Keycloak configuration.
  # // req: FR-AUTH-001, NFR-SEC-AUTH, ADR-013
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    audience: ${KEYCLOAK_AUDIENCE:}

  storage:
    # S3-compatible storage.
    # // req: CONST-TECH-08
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:coc-docs-media}
    region: ${S3_REGION:us-east-1}

logging:
  level:
    org.flywaydb: INFO
