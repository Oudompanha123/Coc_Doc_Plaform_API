# Coc Docs Platform backend — base configuration.
#
# Every environment-specific value is supplied by environment variables with no
# usable default. Backend hosting is [DEFERRED] (PM, 2026-09-08), so this file
# must not assume a provider.  // req: CONST-TECH-08, ADR-012 §2
#
# For a personal local setup (your own Postgres, your own Google OAuth Client
# ID) prefer application-local.yml over editing the defaults below or setting
# five separate env vars: it's gitignored, so real values there can never end
# up in a commit. Activate it with SPRING_PROFILES_ACTIVE=local.

spring:
  application:
    name: docs-platform-backend

  datasource:
    # Any PostgreSQL 15+ instance: managed, corporate, or on-prem.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cocdocs}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      # NFR-SCALE-01 sizing: 200 pages, 10 concurrent editors. A large pool
      # would be waste, not headroom.

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Google ID tokens are verified server-side against Google's JWK set.
          # The frontend never asserts identity.  // req: FR-AUTH-001, TM-001
          issuer-uri: https://accounts.google.com
          audiences: ${GOOGLE_CLIENT_ID:}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Content includes Khmer and Korean; encoding is never left to a platform
  # default on this project.  // req: CONST-OPS-01
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  # Session TTL. AMB-006 resolved 2026-09-08: 1 day. lib/auth.ts:9 in the legacy
  # site was authoritative; CLAUDE.md:172's "30 days" was stale.
  # // req: NFR-SEC-SESSION
  session-ttl: P1D

  # The frontend origin, for CORS. Two services on different origins is a new
  # attack surface that did not exist in the single-service design.
  # // req: ADR-012 §4
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  cookie:
    # ADR-011 §2.5 D1 (default): frontend and backend share a registrable
    # parent domain, so `Lax` behaves exactly as in a single-service design —
    # no CSRF-token framework needs to be built. Switch to `None` only
    # alongside the D2 fallback (mandatory Origin-header checks on every
    # state-changing endpoint), never on its own.  // req: NFR-SEC-SESSION
    same-site: ${COOKIE_SAME_SITE:Lax}
    # `secure` cookies require HTTPS. Left true everywhere except local HTTP
    # dev, which overrides via env var rather than a profile-specific default
    # — this is the one flag that must never be silently false in prod.
    secure: ${COOKIE_SECURE:true}
    # Empty = host-only cookie (fine for local dev, where frontend/backend
    # differ only by port on `localhost`). Set to the shared parent domain
    # (e.g. `.example.com`) once ADR-011 §2.5's D1 domain decision is final.
    domain: ${COOKIE_DOMAIN:}

  oidc:
    # How long a nonce issued by POST /api/auth/nonce remains valid. Short by
    # design: it only has to survive one Google sign-in round trip.
    # // req: FR-AUTH-001, TM-001
    nonce-ttl: PT5M

  storage:
    # S3 API, whichever provider ends up behind it: Supabase Storage, AWS S3,
    # Azure via gateway, or on-prem MinIO.  // req: CONST-TECH-08
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:coc-docs-media}
    region: ${S3_REGION:us-east-1}

logging:
  level:
    org.flywaydb: INFO
