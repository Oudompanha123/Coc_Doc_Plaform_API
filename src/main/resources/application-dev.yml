# Development profile — committed, shared by every developer. Nothing
# sensitive belongs in this file: a real DB password, Google OAuth client id,
# or any other personal/per-machine value is supplied as an environment
# variable when you run the app (DB_URL, DB_PASSWORD, GOOGLE_CLIENT_ID, ...),
# exactly matching the ${VAR:default} placeholders in application.yml — never
# hardcoded here, since this file is part of the repository.
#
# Active by default (application.yml's spring.profiles.active: dev). Only
# the one setting below actually differs from the base config for local
# development; everything else already has a safe, working default.
app:
  # Local development is plain http; a browser discards a Secure cookie on an
  # http origin, so sign-in appears to succeed and then silently does
  # nothing. // req: NFR-SEC-SESSION, NFR-SEC-CHANNEL
  cookie-secure: false
